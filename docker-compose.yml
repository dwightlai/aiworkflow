services:
  postgres:
    image: postgres:16
    container_name: aiworkflow-postgres
    environment:
      POSTGRES_DB: aiworkflow
      POSTGRES_USER: aiworkflow
      POSTGRES_PASSWORD: aiworkflow
    ports:
      - "5432:5432"
    volumes:
      - aiworkflow-postgres-data:/var/lib/postgresql/data

  nacos:
    image: nacos/nacos-server:v2.4.3
    container_name: aiworkflow-nacos
    environment:
      MODE: standalone
      NACOS_AUTH_ENABLE: "false"
    ports:
      - "8848:8848"
      - "9848:9848"
      - "9849:9849"
    volumes:
      - aiworkflow-nacos-data:/home/nacos/data
      - aiworkflow-nacos-logs:/home/nacos/logs

volumes:
  aiworkflow-postgres-data:
  aiworkflow-nacos-data:
  aiworkflow-nacos-logs:
