server:
  port: 8080

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:nacos}
  application:
    name: aiworkflow-server
  cloud:
    nacos:
      discovery:
        enabled: ${NACOS_DISCOVERY_ENABLED:false}
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:}
        group: ${NACOS_GROUP:DEFAULT_GROUP}
        service: ${NACOS_SERVICE_NAME:${spring.application.name}}
        metadata:
          app: aiworkflow
          role: admin-api
  datasource:
    url: ${POSTGRES_JDBC_URL:jdbc:postgresql://localhost:5432/aiworkflow}
    username: ${POSTGRES_USERNAME:aiworkflow}
    password: ${POSTGRES_PASSWORD:aiworkflow}
  flyway:
    enabled: true
    locations: ${FLYWAY_LOCATIONS:classpath:db/migration/postgresql}
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      update-strategy: always

springdoc:
  api-docs:
    path: /v3/api-docs
  override-with-generic-response: false
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
    disable-swagger-default-url: true

third-party:
  organization:
    service-name: ${ORGANIZATION_SERVICE_NAME:organization-service}
    base-url: ${ORGANIZATION_SERVICE_BASE_URL:}
  auth:
    service-name: ${AUTH_SERVICE_NAME:auth-service}
    base-url: ${AUTH_SERVICE_BASE_URL:}

agi:
  auth:
    default-tenant-id: tenant_default
    access-token-seconds: ${AGI_ACCESS_TOKEN_SECONDS:3600}
    refresh-token-seconds: ${AGI_REFRESH_TOKEN_SECONDS:1209600}
    jwt-secret: ${AGI_JWT_SECRET:change-me-agi-development-secret}
  identity:
    mode: ${AGI_IDENTITY_MODE:local}
    fixed-tenant-id: tenant_default
    auto-provision-shadow-user: false
    role-mapping: {}
    remote:
      allow-break-glass-login: true
      disable-local-org-admin: true
    adapter:
      auth: unconfigured
      organization: unconfigured
  storage:
    knowledge-document-dir: ${AGI_STORAGE_KNOWLEDGE_DOCUMENT_DIR:./data/knowledge-documents}
    knowledge-document-save-original: ${AGI_STORAGE_KNOWLEDGE_DOCUMENT_SAVE_ORIGINAL:true}
    research-output-dir: ${AGI_STORAGE_RESEARCH_OUTPUT_DIR:./data/generation-outputs}
    research-docx-master-dir: ${AGI_STORAGE_RESEARCH_DOCX_MASTER_DIR:./data/generation-docx-masters}
